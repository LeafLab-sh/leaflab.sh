name: Dependabot Automerge

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    uses: LeafLab-sh/shared-workflows/.github/workflows/dependabot-auto-merge.yml@1cb552976ad41aab5bc5567009cdb30630bf5553 # v1.2.1
    with:
      approve: true
      app-client-id: ${{ vars.LEAFLAB_AUTOMATION_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.LEAFLAB_AUTOMATION_PRIVATE_KEY }}
